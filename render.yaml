# Render Blueprint for the Svarupa AI dance-learning platform.
#
# How to use (Bhavana does this once in the Render dashboard):
#   1. Sign up at https://dashboard.render.com (free).
#   2. New → Blueprint → connect the GitHub repo BhavanaAngadi123/svarupa.
#   3. Render reads this file, creates the web service + database below,
#      and deploys. The public URL will look like
#      https://svarupa-backend.onrender.com
#      (if that name is taken, Render assigns a variant — use the URL shown
#      at the top of the web service page in the dashboard).
#
# Free-tier notes:
#   - The web service sleeps after ~15 min idle; first request wakes it (~30s).
#   - The Docker build runs `mvn -Pproduction package`, which bundles the
#     Vaadin UI (Node.js is downloaded automatically during the build —
#     no Node needed at runtime).
#   - Stripe stays DISABLED (STRIPE_ENABLED defaults to false in the app);
#     no Stripe keys are needed for the app to boot and serve.
#   - Ollama does not run on Render free, so the AI practice coach serves in
#     its graceful rule-based fallback mode (/api/coach/status →
#     {"enabled":true,"aiAvailable":false}). Everything else — auth,
#     references, sessions, progress — works fully.

services:
  - type: web
    name: svarupa-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      # REQUIRED — the app fails fast at startup without it (>= 32 chars).
      # Render generates a 256-bit random value on first apply.
      - key: SVARUPA_JWT_SECRET
        generateValue: true
      # JVM memory tuning for the 512 MB free instance: cap the heap so the
      # container doesn't get OOM-killed under load (honored by entrypoint.sh).
      - key: JAVA_OPTS
        value: "-Xmx350m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC"
      # Database connection parts. entrypoint.sh composes these into the
      # JDBC DATABASE_URL the app expects (see backend/entrypoint.sh).
      - key: DB_HOST
        fromDatabase:
          name: svarupa-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: svarupa-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: svarupa-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: svarupa-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: svarupa-db
          property: password

databases:
  - name: svarupa-db
    plan: free
